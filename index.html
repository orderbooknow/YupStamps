    function formatAddress(addr) {
        if (!addr) return 'Неизвестно';
        if (addr.length <= 20) return addr;
        if (addr.length >= 64) return addr.slice(0,6)+'…'+addr.slice(-4);
        return addr;

        const x = (r||'').toLowerCase();

        if(x.includes('epic')) return 'rarity-epic';
        if(x.includes('rare')) return 'rarity-rare';

            data.push(...d);
            from += limit;
            hasMore = d.length === limit;
        }
        return data;
    }
    
    async function loadDynamicInstances() {
        let data = [], from = 0, limit = 1000, hasMore = true;
        while (hasMore) {
            const { data: d, error } = await supabaseClient.from('stamp_instances').select('*').range(from, from+limit-1);
            if (error && error.code !== '42P01') throw error;
            if (d) data.push(...d);
            from += limit;
            hasMore = d && d.length === limit;
        }
        return data;
    }
    
    function groupStamps(staticStamps, dynamic) {
        const staticMap = new Map();
        staticStamps.forEach(s => {
            const name = s.base_name || s.title?.replace('Postage Stamp - ', '');
            if (!staticMap.has(name)) staticMap.set(name, { name, group: s.group_name, rarity: s.rarity, image: s.image_url, count: 0, burned: 0, alchemyCount: 0, instances: [] });
            const entry = staticMap.get(name);
            entry.count++;
            if (!s.owner_id || s.owner_id === 'null' || s.owner_id === BURNER_ACCOUNT) entry.burned++;
            else if (s.owner_id === ALCHEMY_ACCOUNT) entry.alchemyCount++;
            else if (s.owner_id && !EXCLUDED_OWNERS.includes(s.owner_id)) entry.instances.push(s.owner_id);
        });
        
        const dynamicMap = new Map();
        dynamic.forEach(item => {
            const name = item.name;
            
            let groupName = 'Alchemist (old-3)';
            if (name === 'Stamp (legendary - 7 Lv)' || name === 'Stamp (legendary - 7Lv)') {
                groupName = 'Alchemist (7)';
            } else if (name === 'Stamp (legendary - 6 Lv)' || name === 'Stamp (legendary - 6Lv)') {
                groupName = 'Alchemist (6)';
            } else if (name === 'Stamp (legendary - 4 Lv)' || name === 'Stamp (legendary - 4Lv)' || 
                       name === 'Stamp (legendary - 5 Lv)' || name === 'Stamp (legendary - 5Lv)') {
                groupName = 'Alchemist (4-5)';
            } else if (name === 'Stamp (legendary - 1 Lv)' || name === 'Stamp (legendary - 1Lv)' ||
                       name === 'Stamp (legendary - 2 Lv)' || name === 'Stamp (legendary - 2Lv)' ||
                       name === 'Stamp (legendary - 3 Lv)' || name === 'Stamp (legendary - 3Lv)' ||
                       name === 'Old stamp (legendary)') {
                groupName = 'Alchemist (old-3)';
            }
            
            if (!dynamicMap.has(name)) dynamicMap.set(name, { 
                name, 
                group: groupName, 
                rarity: 'Legendary', 
                image: item.image_url, 
                count: 0, 
                burned: 0, 
                alchemyCount: 0, 
                instances: [] 
            });
            const entry = dynamicMap.get(name);
            entry.count++;
            if (!item.owner_id || item.owner_id === 'null' || item.owner_id === BURNER_ACCOUNT) entry.burned++;
            else if (item.owner_id === ALCHEMY_ACCOUNT) entry.alchemyCount++;
            else if (item.owner_id && !EXCLUDED_OWNERS.includes(item.owner_id)) entry.instances.push(item.owner_id);
        });
        
        return [...staticMap.values(), ...dynamicMap.values()].sort((a,b)=>a.name.localeCompare(b.name));
    }

    // ==================== ФУНКЦИИ ДЛЯ НАГРАД ====================
    function calculateDistributionForSingle(stamp, rewardAmount) {
        if (!stamp || rewardAmount <= 0) return [];
        const ownerCounts = new Map();
        stamp.instances.forEach(owner => {
            if (owner) ownerCounts.set(owner, (ownerCounts.get(owner) || 0) + 1);
        });
        const total = stamp.count - stamp.burned - stamp.alchemyCount;
        if (total === 0) return [];
        const distribution = [];
        for (const [address, count] of ownerCounts) {
            const share = Math.floor((count / total) * rewardAmount);
            if (share > 0) distribution.push({ address, amount: share });
        }
        return distribution.sort((a, b) => b.amount - a.amount);
    }
    
    function calculateDistributionForCombo(stamps, rewardAmount) {
        if (!stamps || stamps.length === 0 || rewardAmount <= 0) return [];
        const ownersMaps = stamps.map(stamp => {
            const map = new Map();
            stamp.instances.forEach(owner => {
                if (owner) map.set(owner, (map.get(owner) || 0) + 1);
            });
            return map;
        });
        const comboCounts = new Map();
        for (const [owner] of ownersMaps[0]) {
            let hasAll = true;
            let minCount = Infinity;
            for (let i = 0; i < ownersMaps.length; i++) {
                const count = ownersMaps[i].get(owner);
                if (!count) {
                    hasAll = false;
                    break;
                }
                minCount = Math.min(minCount, count);
            }
            if (hasAll) {
                comboCounts.set(owner, minCount);
            }
        }
        const totalCombos = Array.from(comboCounts.values()).reduce((a, b) => a + b, 0);
        if (totalCombos === 0) return [];
        const distribution = [];
        for (const [address, count] of comboCounts) {
            const share = Math.floor((count / totalCombos) * rewardAmount);
            if (share > 0) distribution.push({ address, amount: share });
        }
        return distribution.sort((a, b) => b.amount - a.amount);
    }

            const stamp = groupedStamps.find(s => s.name === stamps[0]);

    async function getCurrentHoldersForRaffle(stampNames, rewardAmount = null) {
        const stamps = Array.isArray(stampNames) ? stampNames : [stampNames];
        const stampsData = [];
        for (const name of stamps) {
            const stamp = groupedStamps.find(s => s.name === name);
            if (!stamp) return null;
            stampsData.push(stamp);
        }
        let distribution = [];
        if (rewardAmount && rewardAmount > 0) {
            if (stamps.length === 1) {
                distribution = calculateDistributionForSingle(stampsData[0], rewardAmount);
            } else {
                distribution = calculateDistributionForCombo(stampsData, rewardAmount);
            }
        }
        if (stamps.length === 1) {
            const stamp = stampsData[0];
            const ownerCounts = new Map();
            stamp.instances.forEach(owner => { if(owner) ownerCounts.set(owner, (ownerCounts.get(owner)||0) + 1); });
            const owners = Array.from(ownerCounts.entries()).map(([a,c]) => ({address:a, count:c})).sort((a,b) => b.count - a.count);
            return {
                type: 'single',
                name: stamp.name,
                group: stamp.group,
                totalCount: stamp.count,
                burned: stamp.burned,
                alchemy: stamp.alchemyCount,
                owners: owners,
                distribution: distribution,
                rewardAmount: rewardAmount
            };
        } else {
            const ownersMaps = stampsData.map(s => {
                const map = new Map();
                s.instances.forEach(owner => { if(owner) map.set(owner, (map.get(owner)||0) + 1); });
                return map;
            });
            const commonOwners = new Set();
            for (const [owner] of ownersMaps[0]) {
                let hasAll = true;
                for (let i = 1; i < ownersMaps.length; i++) {
                    if (!ownersMaps[i].has(owner)) { hasAll = false; break; }
                }
                if (hasAll) commonOwners.add(owner);
            }
            const owners = Array.from(commonOwners).map(owner => {
                let minCount = Infinity;
                for (const map of ownersMaps) minCount = Math.min(minCount, map.get(owner));
                return {address:owner, count:minCount};
            }).sort((a,b) => b.count - a.count);
            const totalCount = stampsData.reduce((sum,s) => sum + s.count, 0);
            const totalBurned = stampsData.reduce((sum,s) => sum + s.burned, 0);
            const totalAlchemy = stampsData.reduce((sum,s) => sum + s.alchemyCount, 0);
            return {
                type: 'combo',
                names: stamps.map(s => s.name),
                group: stampsData[0].group,
                totalCount: totalCount,
                burned: totalBurned,
                alchemy: totalAlchemy,
                owners: owners,
                distribution: distribution,
                rewardAmount: rewardAmount
            };
        }
    }

    function renderChancesTable() {
        const groups = getUniqueGroups();
        const totalGroups = groups.length;
        const groupAvail = {};
        const stampsData = [];
        groupedStamps.forEach(s => {
            if (!s.group) return;
            const gn = s.group.split(',')[0].trim();
            if (currentChancesGroup !== 'all' && gn !== currentChancesGroup) return;
            const avail = Math.max(0, s.count - s.burned - s.alchemyCount);
            stampsData.push({ name: s.name, group: gn, available: avail });
            groupAvail[gn] = (groupAvail[gn] || 0) + avail;
        });
        let items = stampsData.map(s => ({
            name: s.name,
            group: s.group,
            available: s.available,
            chance: (1/totalGroups) * (s.available / (groupAvail[s.group] || 1)) * 100
        }));
        const unique = new Map();
        items.forEach(i => { const key = `${i.name}|${i.group}`; if (!unique.has(key)) unique.set(key, i); });
        let filtered = Array.from(unique.values());
        if (chancesSearchQuery) filtered = filtered.filter(i => i.name.toLowerCase().includes(chancesSearchQuery));
        filtered.sort((a,b) => {
            let va, vb;
            if (chancesSortBy === 'name') { va = a.name.toLowerCase(); vb = b.name.toLowerCase(); return chancesSortOrder === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va); }
            if (chancesSortBy === 'available') { va = a.available; vb = b.available; return chancesSortOrder === 'asc' ? va - vb : vb - va; }
            va = a.chance; vb = b.chance; return chancesSortOrder === 'asc' ? va - vb : vb - va;
        });
        const tbody = document.getElementById('chancesTableBody');
        if (!filtered.length) { tbody.innerHTML = '<tr><td colspan="4">😕 Ничего не найдено</td></tr>'; return; }
        tbody.innerHTML = filtered.map(i => `<tr><td>${i.group}</td><td>${i.name}</td><td>${i.available}</td><td>${i.chance.toFixed(4)}%</td></tr>`).join('');
    }

    function generateCSV(wallets, groups, stamps, grand, grandW) {
        const rows = [['Наименование','Всего','Сожжено','В Лавке',...wallets,'ИТОГО']];
        groups.forEach(g => {

            if (!inGroup.length) return;
            let gt = {count:0,burned:0,alchemy:0};

            rows.push([`📁 ${g}`,'','','',...wallets.map(()=>''),'']);
            inGroup.forEach(st => {
                const wc = wallets.map(w => st.instances.filter(o => o.toLowerCase() === w.toLowerCase()).length);
                const tw = wc.reduce((a,b)=>a+b,0);
                gt.count += st.count; gt.burned += st.burned; gt.alchemy += st.alchemyCount;
                for (let i=0; i<wallets.length; i++) gw[i] += wc[i];
                rows.push([st.name, st.count, st.burned, st.alchemyCount, ...wc, tw]);
            });
            rows.push([`ИТОГО по группе ${g}`, gt.count, gt.burned, gt.alchemy, ...gw, gw.reduce((a,b)=>a+b,0)]);
            rows.push([]);
        });
        rows.push([`🏆 ВСЕГО`, grand.count, grand.burned, grand.alchemy, ...grandW, grandW.reduce((a,b)=>a+b,0)]);
        return rows.map(r => r.join(';')).join('\n');
    }
    
    function showReport(wallets, groups, stamps) {
        const active = wallets.filter(w => w && w.trim());
        if (!active.length) return;
        let collapsed = new Set(groups);
        function render() {
            let html = `<div class="modal-content"><button class="modal-close" onclick="this.closest('.modal').remove()">❌</button><h3>📊 Отчёт по кошелькам</h3><div style="overflow-x:auto;"><table class="report-table"><thead><tr><th>Группа / Марка</th><th>Всего</th><th>Сожжено</th><th>В Лавке</th>${active.map(w => `<th>${formatAddress(w)}</th>`).join('')}<th>ИТОГО</th></thead><tbody>`;
            let grand = {count:0,burned:0,alchemy:0};
            let grandW = new Array(active.length).fill(0);
            groups.forEach(g => {
                const inGroup = stamps.filter(s => s.group && (s.group === g || s.group.includes(g)));
                if (!inGroup.length) return;
                let gt = {count:0,burned:0,alchemy:0};
                let gw = new Array(active.length).fill(0);
                const isCollapsed = collapsed.has(g);
                html += `<tr class="group-header" data-group="${g}"><td colspan="${4+active.length+1}"><span class="toggle-icon">${isCollapsed ? '▶' : '▼'}</span> <strong>📁 ${g}</strong><table><title="group-stamps ${isCollapsed ? 'collapsed' : ''}" data-group-body="${g}">`;
                inGroup.forEach(st => {
                    const wc = active.map(w => st.instances.filter(o => o.toLowerCase() === w.toLowerCase()).length);
                    const tw = wc.reduce((a,b)=>a+b,0);
                    gt.count += st.count; gt.burned += st.burned; gt.alchemy += st.alchemyCount;
                    for (let i=0; i<active.length; i++) gw[i] += wc[i];
                    grand.count += st.count; grand.burned += st.burned; grand.alchemy += st.alchemyCount;
                    for (let i=0; i<active.length; i++) grandW[i] += wc[i];
                    html += `<tr><td style="padding-left:20px;">${st.name}</td><td>${st.count}</td><td>${st.burned}</td><td>${st.alchemyCount}</td>${wc.map(c => `<td><strong>${c}</strong></td>`).join('')}<td><strong>${tw}</strong></td></tr>`;
                });
                html += `<tr class="total-row"><tr><strong>ИТОГО по группе</strong></td><td><strong>${gt.count}</strong></td><td><strong>${gt.burned}</strong></td><td><strong>${gt.alchemy}</strong></td>${gw.map(t => `<td><strong>${t}</strong></td>`).join('')}<td><strong>${gw.reduce((a,b)=>a+b,0)}</strong></td></tr>`;
            });
            html += `<tr class="grand-total-row"><td><strong>ИТОГО ПО ВСЕМ</strong></td><td><strong>${grand.count}</strong></td><td><strong>${grand.burned}</strong></td><td><strong>${grand.alchemy}</strong></td>${grandW.map(t => `<td><strong>${t}</strong></td>`).join('')}<td><strong>${grandW.reduce((a,b)=>a+b,0)}</strong></td></tr>`;
            html += `</tbody></table></div><div style="display:flex;gap:10px;margin-top:16px;">`;
            if (isMobile() || currentUserId) {
                html += `<button id="sendToBotBtn" class="modal-btn" style="background:#2ecc71;">📤 Отправить в Telegram</button>`;
            } else {
                html += `<button id="csvDownloadBtn" class="modal-btn" style="background:#334155;">📥 Скачать CSV</button>`;
            }
            html += `<button class="modal-btn" onclick="this.closest('.modal').remove()">Закрыть</button></div></div>`;
            const modal = document.createElement('div'); modal.className = 'modal'; modal.innerHTML = html; document.body.appendChild(modal);
            document.querySelectorAll('.group-header').forEach(h => {
                h.addEventListener('click', () => {
                    const grp = h.dataset.group;
                    if (collapsed.has(grp)) collapsed.delete(grp);
                    else collapsed.add(grp);
                    modal.remove(); render();
                });
            });
            const sendBtn = document.getElementById('sendToBotBtn');
            if (sendBtn) {
                sendBtn.onclick = async () => {
                    const csv = generateCSV(active, groups, stamps, grand, grandW);
                    let chatId = currentUserId;
                    if (!chatId) {
                        const inp = prompt('Введите ваш Telegram ID (узнать у @userinfobot):');
                        if (!inp) return;
                        chatId = parseInt(inp, 10);
                        if (isNaN(chatId)) return;
                    }
                    const res = await fetch(EDGE_FUNCTION_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ chatId, wallets: active, csvContent: csv })
                    });
                    const result = await res.json();
                    alert(result.success ? '✅ Отправлено!' : '❌ Ошибка');
                };
            }
            const csvBtn = document.getElementById('csvDownloadBtn');
            if (csvBtn) {
                csvBtn.onclick = () => {
                    const csv = generateCSV(active, groups, stamps, grand, grandW);
                    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv' });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = `report_${active.join('_')}.csv`;
                    link.click();
                    URL.revokeObjectURL(link.href);
                };
            }
        }
        render();
    }
    
    function downloadReport() {
        const saved = JSON.parse(localStorage.getItem('savedWallets') || '["","",""]');
        const html = `<div class="modal-content"><button class="modal-close" onclick="this.closest('.modal').remove()">❌</button><h3>📊 Отчёт по кошелькам</h3><div class="report-input-group"><input type="text" id="w1" class="report-input" placeholder="Кошелёк 1" value="${saved[0]}"><input type="text" id="w2" class="report-input" placeholder="Кошелёк 2" value="${saved[1]}"><input type="text" id="w3" class="report-input" placeholder="Кошелёк 3" value="${saved[2]}"><button id="clearBtn" class="modal-btn clear-wallets-btn">🗑 Очистить</button></div><button id="genBtn" class="modal-btn">Сформировать</button></div>`;
        const modal = document.createElement('div'); modal.className = 'modal'; modal.innerHTML = html; document.body.appendChild(modal);
        document.getElementById('genBtn').onclick = () => {
            const w1 = document.getElementById('w1').value.trim();
            const w2 = document.getElementById('w2').value.trim();
            const w3 = document.getElementById('w3').value.trim();
            const wallets = [w1, w2, w3].filter(w => w);
            if (!wallets.length) { alert('Введите кошелёк'); return; }
            localStorage.setItem('savedWallets', JSON.stringify([w1, w2, w3]));
            modal.remove();
            showReport(wallets, getUniqueGroups(), groupedStamps);
        };
        document.getElementById('clearBtn').onclick = () => {
            localStorage.setItem('savedWallets', JSON.stringify(['', '', '']));
            document.getElementById('w1').value = '';
            document.getElementById('w2').value = '';
            document.getElementById('w3').value = '';
            alert('Очищено');
        };
    }
    
    function setupTabs() {
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', async () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentTab = tab.dataset.tab;
                document.getElementById('galleryView').style.display = currentTab === 'gallery' ? 'block' : 'none';
                document.getElementById('holdersView').style.display = currentTab === 'holders' ? 'block' : 'none';
                document.getElementById('historyView').style.display = currentTab === 'history' ? 'block' : 'none';
                document.getElementById('chancesView').style.display = currentTab === 'chances' ? 'block' : 'none';
                if (currentTab === 'holders') buildHoldersList();
                if (currentTab === 'history') await renderHistory();
                if (currentTab === 'gallery') renderGallery();
                if (currentTab === 'chances') renderChancesTable();
            });
        });
    }
    
    async function init() {
        initTheme();
        loadSavedUser();
        updateUserUI();
        
        document.getElementById('themeToggle').addEventListener('click', toggleTheme);
        document.getElementById('reportBtn').addEventListener('click', downloadReport);
        document.getElementById('showLoginModalBtn').addEventListener('click', showPCLoginModal);
        
        if (isAdmin) {
            document.getElementById('raffleSingleBtn')?.addEventListener('click', () => runRaffleMode('single'));
            document.getElementById('raffleCombo2Btn')?.addEventListener('click', () => runRaffleMode('combo2'));
            document.getElementById('raffleCombo3Btn')?.addEventListener('click', () => runRaffleMode('combo3'));
            document.getElementById('updateDataBtn')?.addEventListener('click', triggerGitHubActions);
        }
        
        document.getElementById('rankByCountBtn').addEventListener('click', () => {
            currentRankMode = 'count';
            document.getElementById('rankByCountBtn').classList.add('active');
            document.getElementById('rankByUniqueBtn').classList.remove('active');
            if (currentTab === 'holders') buildHoldersList();
        });
        document.getElementById('rankByUniqueBtn').addEventListener('click', () => {
            currentRankMode = 'unique';
            document.getElementById('rankByCountBtn').classList.remove('active');
            document.getElementById('rankByUniqueBtn').classList.add('active');
            if (currentTab === 'holders') buildHoldersList();
        });
        document.getElementById('galleryFindBtn').addEventListener('click', () => {
            searchQuery = document.getElementById('gallerySearchInput').value.toLowerCase().trim();
            renderGallery();
        });
        document.getElementById('gallerySearchInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') {
                searchQuery = e.target.value.toLowerCase().trim();
                renderGallery();
            }
        });
        document.getElementById('findWalletBtn').addEventListener('click', () => {
            if (currentTab === 'holders') buildHoldersList();
            else alert('Перейдите на вкладку "Топ держатели"');
        });
        document.getElementById('walletSearchInput').addEventListener('keypress', e => {
            if (e.key === 'Enter' && currentTab === 'holders') buildHoldersList();
        });
        document.getElementById('chancesFindBtn').addEventListener('click', () => {
            chancesSearchQuery = document.getElementById('chancesSearchInput').value.toLowerCase().trim();
            renderChancesTable();
        });
        document.getElementById('chancesSearchInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') {
                chancesSearchQuery = e.target.value.toLowerCase().trim();
                renderChancesTable();
            }
        });
        document.querySelectorAll('.chance-sort').forEach(header => {
            header.addEventListener('click', () => {
                const sort = header.dataset.sort;
                if (chancesSortBy === sort) chancesSortOrder = chancesSortOrder === 'asc' ? 'desc' : 'asc';
                else { chancesSortBy = sort; chancesSortOrder = 'desc'; }
                renderChancesTable();
            });
        });
        
        document.getElementById('debugInfo').innerHTML = '🔄 Загрузка...';
        try {
            const [staticData, dynamicData] = await Promise.all([loadStaticStamps(), loadDynamicInstances()]);
            allStamps = staticData;
            dynamicInstances = dynamicData;
            groupedStamps = groupStamps(staticData, dynamicData);
            document.getElementById('debugInfo').innerHTML = `✅ Загружено ${staticData.length + dynamicData.length} экземпляров, ${groupedStamps.length} видов`;
            updateStats();
            renderGroupFilters();
            renderGallery();
            setupTabs();
        } catch (e) {
            document.getElementById('debugInfo').innerHTML = '❌ ' + e.message;
            console.error(e);
        }
    }
    init();
</script>
</body>
</html>
