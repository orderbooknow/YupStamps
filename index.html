<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Yupland NFT Explorer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #1a1a2e;
            color: #eee;
            padding: 16px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        
        .search-input {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            background: #16213e;
            color: #eee;
            border: none;
            border-radius: 12px;
            outline: none;
            margin-bottom: 12px;
        }
        
        .stats {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .stat-card {
            flex: 1;
            min-width: 100px;
            background: #16213e;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
        }
        .stat-value {
            font-size: 22px;
            font-weight: bold;
            color: #e94560;
        }
        .stat-label {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 4px;
        }
        
        .nft-card {
            background: #16213e;
            border-radius: 16px;
            margin-bottom: 16px;
            overflow: hidden;
            display: flex;
            gap: 12px;
            padding: 12px;
        }
        .nft-image {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 12px;
            background: #0f3460;
            flex-shrink: 0;
        }
        .nft-info {
            flex: 1;
        }
        .nft-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .nft-id {
            font-size: 10px;
            opacity: 0.5;
            font-family: monospace;
            margin-bottom: 4px;
        }
        .nft-owner {
            font-size: 12px;
            padding: 4px 8px;
            background: #0f3460;
            border-radius: 6px;
            display: inline-block;
            margin-top: 6px;
        }
        
        .loading, .no-results {
            text-align: center;
            padding: 40px;
            opacity: 0.6;
        }
        
        .debug {
            font-size: 12px;
            opacity: 0.5;
            text-align: center;
            margin-top: 20px;
            padding: 10px;
            background: #0f0f1a;
            border-radius: 8px;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>🎨 Yupland NFT Explorer</h2>
    <p style="font-size: 12px; opacity: 0.6; margin-bottom: 16px;">NEAR Blockchain • NFT Collection</p>
    
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Поиск по ID или владельцу...">
    
    <div class="stats">
        <div class="stat-card">
            <div class="stat-value" id="totalSupply">...</div>
            <div class="stat-label">Загружено NFT</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="holdersCount">...</div>
            <div class="stat-label">Держателей</div>
        </div>
    </div>
    
    <div id="results"><div class="loading">🔄 Загрузка NFT...</div></div>
    
    <div class="debug" id="debugInfo">🟢 Загрузка...</div>
</div>

<script>
    const CONTRACT_ID = 'yuplandshop.mintbase1.near';
    const RPC_URL = 'https://rpc.mainnet.near.org';
    
    let allNFTs = [];
    let filteredNFTs = [];
    
    // Вызов view-метода
    async function callView(method, args) {
        try {
            const response = await fetch(RPC_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    jsonrpc: '2.0',
                    id: '1',
                    method: 'query',
                    params: {
                        request_type: 'call_function',
                        account_id: CONTRACT_ID,
                        method_name: method,
                        args_base64: btoa(JSON.stringify(args))
                    }
                })
            });
            const data = await response.json();
            if (data.result && data.result.result) {
                return JSON.parse(atob(data.result.result));
            }
            return null;
        } catch(e) {
            console.error(`RPC Error (${method}):`, e);
            return null;
        }
    }
    
    // Получить общее количество NFT
    async function getTotalSupply() {
        try {
            const supply = await callView('nft_total_supply', {});
            if (supply !== null) {
                return typeof supply === 'object' ? parseInt(supply) : parseInt(supply);
            }
        } catch(e) { console.error(e); }
        return null;
    }
    
    // Прямой вызов: проверяем, какие методы есть у контракта
    async function testContractMethods() {
        const methodsToTest = ['nft_total_supply', 'nft_tokens', 'nft_supply_for_owner', 'nft_tokens_for_owner'];
        const results = {};
        
        for (const method of methodsToTest) {
            try {
                const result = await callView(method, {});
                results[method] = result !== null ? '✅ работает' : '❌ не работает';
                if (method === 'nft_total_supply' && result !== null) {
                    results[method] = `✅ работает (значение: ${result})`;
                }
            } catch(e) {
                results[method] = '❌ ошибка';
            }
        }
        
        document.getElementById('debugInfo').innerHTML = `
            🔍 Диагностика контракта ${CONTRACT_ID}:<br>
            • nft_total_supply: ${results.nft_total_supply}<br>
            • nft_tokens: ${results.nft_tokens}<br>
            • nft_supply_for_owner: ${results.nft_supply_for_owner}<br>
            • nft_tokens_for_owner: ${results.nft_tokens_for_owner}
        `;
        
        return results;
    }
    
    // Пытаемся найти NFT через владельцев
    async function findNFTsThroughOwners() {
        const possibleOwners = [
            'i1n5n.tg',
            'ser_petrow.tg',
            'ivanivanivan42.tg',
            'kvazarus13.tg',
            'apple_two2.tg',
            'darai_collection.near',
            'alchemistshop.near'
        ];
        
        const nftMap = new Map();
        
        for (const owner of possibleOwners) {
            try {
                const tokens = await callView('nft_tokens_for_owner', {
                    account_id: owner,
                    limit: 50
                });
                
                if (tokens && tokens.length > 0) {
                    tokens.forEach(token => {
                        if (!nftMap.has(token.token_id)) {
                            nftMap.set(token.token_id, token);
                        }
                    });
                    document.getElementById('debugInfo').innerHTML += `<br>✅ Найдено ${tokens.length} NFT у ${owner}`;
                }
            } catch(e) {
                // игнорируем
            }
        }
        
        return Array.from(nftMap.values());
    }
    
    // Fallback: используем известные token_id
    async function loadFallbackNFTs() {
        const knownTokenIds = ['104848', '128680', '93140', '106086', '128161', '102144', '105796'];
        const nfts = [];
        
        for (const tokenId of knownTokenIds) {
            try {
                const nft = await callView('nft_token', { token_id: tokenId });
                if (nft && nft.metadata) {
                    nfts.push(nft);
                }
            } catch(e) {}
        }
        
        return nfts;
    }
    
    // Загрузка всех NFT
    async function loadAllNFTs() {
        document.getElementById('debugInfo').innerHTML = '🔄 Диагностика контракта...';
        
        // 1. Сначала проверяем, какие методы работают
        const methods = await testContractMethods();
        
        // 2. Пытаемся найти NFT через владельцев
        document.getElementById('debugInfo').innerHTML = '🔍 Поиск NFT через владельцев...';
        let nfts = await findNFTsThroughOwners();
        
        // 3. Если ничего не нашли, используем fallback
        if (nfts.length === 0) {
            document.getElementById('debugInfo').innerHTML = '🔄 Загрузка демо-данных...';
            nfts = await loadFallbackNFTs();
        }
        
        allNFTs = nfts;
        
        const totalSupply = await getTotalSupply();
        document.getElementById('totalSupply').textContent = allNFTs.length;
        
        // Уникальные держатели
        const uniqueOwners = new Set();
        allNFTs.forEach(nft => {
            if (nft.owner_id) uniqueOwners.add(nft.owner_id);
        });
        document.getElementById('holdersCount').textContent = uniqueOwners.size;
        
        document.getElementById('debugInfo').innerHTML += `<br>✅ Загружено ${allNFTs.length} NFT`;
        
        filterNFTs();
    }
    
    // Фильтрация
    function filterNFTs() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        
        filteredNFTs = allNFTs.filter(nft => {
            if (query) {
                const id = (nft.token_id || '').toLowerCase();
                const owner = (nft.owner_id || '').toLowerCase();
                return id.includes(query) || owner.includes(query);
            }
            return true;
        });
        
        renderGallery();
    }
    
    // Рендер
    function renderGallery() {
        const container = document.getElementById('results');
        
        if (filteredNFTs.length === 0 && allNFTs.length === 0) {
            container.innerHTML = '<div class="loading">🔄 Не удалось загрузить NFT из контракта<br><br>Контракт не поддерживает метод nft_tokens для получения всей коллекции.<br><br>📌 Для полного доступа нужен Mintbase GraphQL API</div>';
            return;
        }
        
        if (filteredNFTs.length === 0) {
            container.innerHTML = '<div class="no-results">😕 Ничего не найдено</div>';
            return;
        }
        
        container.innerHTML = filteredNFTs.map(nft => `
            <div class="nft-card">
                ${nft.metadata?.media ? 
                    `<img class="nft-image" src="${nft.metadata.media}" alt="${nft.metadata?.title || nft.token_id}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'%23666\'%3E%3Crect width=\'24\' height=\'24\'/%3E%3Ctext x=\'12\' y=\'16\' text-anchor=\'middle\' fill=\'%23aaa\'%3E🖼️%3C/text%3E%3C/svg%3E'">` : 
                    `<div class="nft-image" style="display: flex; align-items: center; justify-content: center; font-size: 30px;">🖼️</div>`
                }
                <div class="nft-info">
                    <div class="nft-title">${nft.metadata?.title || 'Без названия'}</div>
                    <div class="nft-id">ID: ${nft.token_id}</div>
                    <div class="nft-owner">👤 ${nft.owner_id || 'Неизвестно'}</div>
                </div>
            </div>
        `).join('');
    }
    
    document.getElementById('searchInput').addEventListener('input', filterNFTs);
    
    loadAllNFTs();
</script>
</body>
</html>
