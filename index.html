<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Yupland NFT Explorer</title>
    <script src="https://telegram.org/js/telegram-web-app.js" onerror="console.log('Browser mode')"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #1a1a2e;
            color: #eee;
            padding: 16px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        
        .search-input {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            background: #16213e;
            color: #eee;
            border: none;
            border-radius: 12px;
            outline: none;
            margin-bottom: 12px;
        }
        
        .filters {
            display: flex;
            gap: 8px;
            margin: 12px 0;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 6px 14px;
            background: #16213e;
            color: #eee;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
        }
        .filter-btn.active {
            background: #0f3460;
            color: #e94560;
        }
        
        .stats {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .stat-card {
            flex: 1;
            min-width: 100px;
            background: #16213e;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
        }
        .stat-value {
            font-size: 22px;
            font-weight: bold;
            color: #e94560;
        }
        .stat-label {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 4px;
        }
        
        .tabs {
            display: flex;
            gap: 4px;
            background: #16213e;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 20px;
        }
        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }
        .tab.active {
            background: #0f3460;
            color: #e94560;
        }
        
        .nft-card {
            background: #16213e;
            border-radius: 16px;
            margin-bottom: 16px;
            overflow: hidden;
            display: flex;
            gap: 12px;
            padding: 12px;
        }
        .nft-image {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 12px;
            background: #0f3460;
            flex-shrink: 0;
        }
        .nft-info {
            flex: 1;
        }
        .nft-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .nft-id {
            font-size: 10px;
            opacity: 0.5;
            font-family: monospace;
            margin-bottom: 4px;
        }
        .nft-owner {
            font-size: 12px;
            padding: 4px 8px;
            background: #0f3460;
            border-radius: 6px;
            display: inline-block;
            margin-top: 6px;
        }
        .rarity-badge {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 12px;
            display: inline-block;
            margin-left: 8px;
        }
        .rarity-legend { background: #ffd700; color: #000; }
        .rarity-epic { background: #9b59b6; color: #fff; }
        .rarity-rare { background: #3498db; color: #fff; }
        .rarity-common { background: #7f8c8d; color: #fff; }
        
        .holder-row {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            background: #16213e;
            border-radius: 10px;
            margin-bottom: 8px;
        }
        .holder-rank {
            font-weight: bold;
            width: 40px;
        }
        .holder-address {
            flex: 1;
            font-family: monospace;
            font-size: 13px;
        }
        .holder-count {
            font-weight: bold;
            color: #e94560;
        }
        
        .loading, .no-results {
            text-align: center;
            padding: 40px;
            opacity: 0.6;
        }
        
        .load-more {
            margin: 20px 0;
            width: 100%;
            padding: 12px;
            background: #0f3460;
            color: #eee;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }
        
        .debug {
            font-size: 12px;
            opacity: 0.5;
            text-align: center;
            margin-top: 20px;
            padding: 10px;
            background: #0f0f1a;
            border-radius: 8px;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>🎨 Yupland NFT Explorer</h2>
    <p style="font-size: 12px; opacity: 0.6; margin-bottom: 16px;">NEAR Blockchain • NFT Collection</p>
    
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Поиск по названию или владельцу...">
    
    <div class="filters" id="rarityFilters">
        <button class="filter-btn active" data-rarity="all">Все</button>
        <button class="filter-btn" data-rarity="legend">⭐ Legend</button>
        <button class="filter-btn" data-rarity="epic">💜 Epic</button>
        <button class="filter-btn" data-rarity="rare">💙 Rare</button>
        <button class="filter-btn" data-rarity="common">🤍 Common</button>
    </div>
    
    <div class="stats">
        <div class="stat-card">
            <div class="stat-value" id="totalSupply">...</div>
            <div class="stat-label">Всего NFT</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="burnedCount">...</div>
            <div class="stat-label">Сожжено</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="holdersCount">...</div>
            <div class="stat-label">Держателей</div>
        </div>
    </div>
    
    <div class="tabs">
        <div class="tab active" data-tab="gallery">🖼️ Галерея</div>
        <div class="tab" data-tab="holders">🏆 Топ держатели</div>
    </div>
    
    <div id="galleryView">
        <div id="results"><div class="loading">🔄 Загрузка NFT...</div></div>
        <button id="loadMoreBtn" class="load-more" style="display: none;">Загрузить ещё</button>
    </div>
    
    <div id="holdersView" style="display: none;">
        <div id="holdersList"></div>
    </div>
    
    <div class="debug" id="debugInfo">🟢 Загрузка...</div>
</div>

<script>
    // Конфигурация
    const CONTRACT_ID = 'yuplandshop.mintbase1.near';
    
    // Состояние
    let allNFTs = [];
    let filteredNFTs = [];
    let currentRarity = 'all';
    let currentTab = 'gallery';
    let displayedCount = 20;
    
    // Функция для прямого вызова view-методов контракта
    async function callView(method, args) {
        try {
            const response = await fetch('https://rpc.mainnet.near.org', {
                method: 'POST',
                headers: { 'Content-Type':: 'application/json' },
                body: JSON.stringify({
                    jsonrpc: '2.0',
                    id: '1',
                    method: 'query',
                    params: {
                        request_type: 'call_function',
                        account_id: CONTRACT_ID,
                        method_name: method,
                        args_base64: btoa(JSON.stringify(args))
                    }
                })
            });
            const data = await response.json();
            if (data.result && data.result.result) {
                return JSON.parse(atob(data.result.result));
            }
            return null;
        } catch(e) {
            console.error(`RPC Error (${method}):`, e);
            return null;
        }
    }
    
    // Получить общее количество NFT через nft_total_supply
    async function getTotalSupply() {
        try {
            const supply = await callView('nft_total_supply', {});
            if (supply !== null) {
                return typeof supply === 'object' ? parseInt(supply) : parseInt(supply);
            }
        } catch(e) { console.error(e); }
        return null;
    }
    
    // ПОЛУЧАЕМ NFT ЧЕРЕЗ АККАУНТЫ-МИНТЕРЫ
    // Вместо nft_tokens (который не работает), собираем NFT из mint/batch_mint транзакций
    async function getNFTsFromTransactions() {
        const nftMap = new Map(); // token_id -> NFT данные
        
        // Список известных аккаунтов, которые минтят NFT в эту коллекцию
        // Из данных на NearBlocks: darai_collection.near, alchemistshop.near и др. [citation:5][citation:10]
        const minterAccounts = [
            'darai_collection.near',
            'alchemistshop.near',
            'councilofelders.near'
        ];
        
        // Для каждого минтера получаем его NFT через nft_tokens_for_owner
        for (const minter of minterAccounts) {
            try {
                const tokens = await callView('nft_tokens_for_owner', {
                    account_id: minter,
                    limit: 200
                });
                
                if (tokens && tokens.length > 0) {
                    tokens.forEach(token => {
                        if (!nftMap.has(token.token_id)) {
                            token.rarity = getRarity(token.metadata?.title);
                            nftMap.set(token.token_id, token);
                        }
                    });
                }
            } catch(e) {
                console.log(`No tokens from ${minter}:`, e);
            }
        }
        
        return Array.from(nftMap.values());
    }
    
    // Альтернатива: получаем последние транзакции и извлекаем token_id
    async function getNFTsFromRecentTransactions() {
        // Используем NearBlocks API для получения последних NFT-транзакций
        try {
            const response = await fetch(`https://api.nearblocks.io/v1/account/${CONTRACT_ID}/txns?per_page=100`);
            const data = await response.json();
            
            const nftMap = new Map();
            const tokenIds = new Set();
            
            if (data.txns) {
                for (const tx of data.txns) {
                    // Ищем token_id в actions
                    if (tx.actions) {
                        for (const action of tx.actions) {
                            if (action.params && action.params.token_id) {
                                tokenIds.add(action.params.token_id);
                            }
                            if (action.token_id) {
                                tokenIds.add(action.token_id);
                            }
                        }
                    }
                }
            }
            
            // Теперь получаем данные по каждому token_id
            for (const tokenId of Array.from(tokenIds).slice(0, 100)) {
                try {
                    const nft = await callView('nft_token', { token_id: tokenId });
                    if (nft) {
                        nft.rarity = getRarity(nft.metadata?.title);
                        nftMap.set(tokenId, nft);
                    }
                } catch(e) {}
            }
            
            return Array.from(nftMap.values());
        } catch(e) {
            console.error('Error fetching from NearBlocks:', e);
            return [];
        }
    }
    
    // Определение редкости по названию
    function getRarity(title) {
        if (!title) return 'common';
        const lower = title.toLowerCase();
        if (lower.includes('legend') || lower.includes('⭐')) return 'legend';
        if (lower.includes('epic') || lower.includes('💜')) return 'epic';
        if (lower.includes('rare') || lower.includes('💙')) return 'rare';
        return 'common';
    }
    
    // Загрузка NFT - комбинированный подход
    async function loadAllNFTs() {
        document.getElementById('debugInfo').innerHTML = '🔄 Загрузка NFT... Это может занять до 30 секунд';
        
        // Пытаемся загрузить через minter аккаунты
        let nfts = await getNFTsFromTransactions();
        
        if (nfts.length === 0) {
            // Если не сработало, пробуем через транзакции
            nfts = await getNFTsFromRecentTransactions();
        }
        
        if (nfts.length === 0) {
            // Последний шанс: используем примеры из транзакций
            // Эти token_id я нашел в реальных транзакциях
            const fallbackTokenIds = ['104848', '128680', '93140', '106086', '128161'];
            
            for (const tokenId of fallbackTokenIds) {
                try {
                    const nft = await callView('nft_token', { token_id: tokenId });
                    if (nft) {
                        nft.rarity = getRarity(nft.metadata?.title);
                        nfts.push(nft);
                    }
                } catch(e) {}
            }
        }
        
        allNFTs = nfts;
        
        // Получаем общее количество, если возможно
        const totalSupply = await getTotalSupply();
        if (totalSupply) {
            document.getElementById('totalSupply').textContent = totalSupply;
        } else {
            document.getElementById('totalSupply').textContent = allNFTs.length;
        }
        
        document.getElementById('debugInfo').innerHTML = `✅ Загружено ${allNFTs.length} NFT из контракта ${CONTRACT_ID}`;
        
        // Обновляем статистику
        await updateStats();
        
        return allNFTs;
    }
    
    // Обновление статистики (сожженные, держатели)
    async function updateStats() {
        if (allNFTs.length === 0) return;
        
        const uniqueOwners = new Set();
        let burned = 0;
        
        allNFTs.forEach(nft => {
            const owner = nft.owner_id;
            if (owner && !owner.includes('system') && !owner.includes('burn')) {
                uniqueOwners.add(owner);
            }
            if (owner === 'system' || owner?.includes('burn') || !owner) {
                burned++;
            }
        });
        
        document.getElementById('holdersCount').textContent = uniqueOwners.size;
        document.getElementById('burnedCount').textContent = burned;
    }
    
    // Фильтрация
    function filterNFTs() {
        const searchQuery = document.getElementById('searchInput').value.toLowerCase();
        
        filteredNFTs = allNFTs.filter(nft => {
            if (currentRarity !== 'all' && nft.rarity !== currentRarity) return false;
            if (searchQuery) {
                const title = (nft.metadata?.title || '').toLowerCase();
                const owner = (nft.owner_id || '').toLowerCase();
                if (!title.includes(searchQuery) && !owner.includes(searchQuery)) return false;
            }
            return true;
        });
        
        renderGallery();
    }
    
    // Рендер галереи
    function renderGallery() {
        const container = document.getElementById('results');
        const loadMoreBtn = document.getElementById('loadMoreBtn');
        const toShow = filteredNFTs.slice(0, displayedCount);
        
        if (toShow.length === 0 && allNFTs.length === 0) {
            container.innerHTML = '<div class="loading">🔄 Загрузка коллекции... (первая загрузка может занять время)</div>';
            loadMoreBtn.style.display = 'none';
            return;
        }
        
        if (toShow.length === 0) {
            container.innerHTML = '<div class="no-results">😕 Ничего не найдено</div>';
            loadMoreBtn.style.display = 'none';
            return;
        }
        
        const rarityLabels = {
            legend: '⭐ Legend',
            epic: '💜 Epic',
            rare: '💙 Rare',
            common: '🤍 Common'
        };
        
        container.innerHTML = toShow.map(nft => `
            <div class="nft-card">
                ${nft.metadata?.media ? 
                    `<img class="nft-image" src="${nft.metadata.media}" alt="${nft.metadata?.title || nft.token_id}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'%23666\'%3E%3Crect width=\'24\' height=\'24\'/%3E%3Ctext x=\'12\' y=\'16\' text-anchor=\'middle\' fill=\'%23aaa\'%3E🖼️%3C/text%3E%3C/svg%3E'">` : 
                    `<div class="nft-image" style="display: flex; align-items: center; justify-content: center; font-size: 30px;">🖼️</div>`
                }
                <div class="nft-info">
                    <div class="nft-title">
                        ${nft.metadata?.title || 'Без названия'}
                        <span class="rarity-badge rarity-${nft.rarity}">${rarityLabels[nft.rarity] || 'Common'}</span>
                    </div>
                    <div class="nft-id">ID: ${nft.token_id}</div>
                    <div class="nft-owner">
                        👤 ${nft.owner_id || 'Неизвестно'}
                    </div>
                </div>
            </div>
        `).join('');
        
        loadMoreBtn.style.display = displayedCount < filteredNFTs.length ? 'block' : 'none';
    }
    
    // Топ держатели
    async function loadTopHolders() {
        const container = document.getElementById('holdersList');
        if (allNFTs.length === 0) {
            container.innerHTML = '<div class="loading">🏆 Загрузка...</div>';
            await loadAllNFTs();
        }
        
        const ownerMap = new Map();
        for (const nft of allNFTs) {
            const owner = nft.owner_id;
            if (owner && !owner.includes('system') && !owner.includes('burn')) {
                ownerMap.set(owner, (ownerMap.get(owner) || 0) + 1);
            }
        }
        
        const holders = Array.from(ownerMap.entries())
            .map(([address, count]) => ({ address, count }))
            .sort((a, b) => b.count - a.count)
            .slice(0, 50);
        
        if (holders.length === 0) {
            container.innerHTML = '<div class="no-results">😕 Нет данных о держателях</div>';
            return;
        }
        
        container.innerHTML = holders.map((holder, idx) => `
            <div class="holder-row">
                <span class="holder-rank">#${idx + 1}</span>
                <span class="holder-address">${holder.address}</span>
                <span class="holder-count">${holder.count} NFT</span>
            </div>
        `).join('');
    }
    
    // Обработчики
    document.getElementById('searchInput').addEventListener('input', () => {
        displayedCount = 20;
        filterNFTs();
    });
    
    document.querySelectorAll('[data-rarity]').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('[data-rarity]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentRarity = btn.dataset.rarity;
            displayedCount = 20;
            filterNFTs();
        });
    });
    
    document.getElementById('loadMoreBtn').addEventListener('click', () => {
        displayedCount += 20;
        renderGallery();
    });
    
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            currentTab = tab.dataset.tab;
            
            if (currentTab === 'gallery') {
                document.getElementById('galleryView').style.display = 'block';
                document.getElementById('holdersView').style.display = 'none';
                filterNFTs();
            } else {
                document.getElementById('galleryView').style.display = 'none';
                document.getElementById('holdersView').style.display = 'block';
                loadTopHolders();
            }
        });
    });
    
    // Запуск
    async function init() {
        await loadAllNFTs();
        filterNFTs();
    }
    
    init();
</script>
</body>
</html>
