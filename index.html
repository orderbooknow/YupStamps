<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Yupland Stamps Explorer</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #1a1a2e; color: #eee; padding: 16px; }
        .container { max-width: 600px; margin: 0 auto; }
        .btn { background: #0f3460; color: #eee; border: none; padding: 12px 20px; border-radius: 12px; font-size: 16px; cursor: pointer; width: 100%; margin-bottom: 16px; }
        .btn-primary { background: #e94560; }
        .tabs { display: flex; gap: 4px; background: #16213e; border-radius: 12px; padding: 4px; margin-bottom: 20px; }
        .tab { flex: 1; padding: 10px; text-align: center; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 500; }
        .tab.active { background: #0f3460; color: #e94560; }
        .stamp-card { background: #16213e; border-radius: 16px; margin-bottom: 16px; overflow: hidden; display: flex; gap: 12px; padding: 12px; }
        .stamp-image { width: 80px; height: 80px; object-fit: cover; border-radius: 12px; background: #0f3460; flex-shrink: 0; }
        .stamp-info { flex: 1; }
        .stamp-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
        .stamp-group { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
        .stamp-owner { font-size: 12px; padding: 4px 8px; background: #0f3460; border-radius: 6px; display: inline-block; margin-top: 6px; }
        .rarity-badge { font-size: 10px; padding: 2px 8px; border-radius: 12px; display: inline-block; margin-left: 8px; }
        .rarity-legend { background: #ffd700; color: #000; }
        .rarity-epic { background: #9b59b6; }
        .rarity-rare { background: #3498db; }
        .rarity-common { background: #7f8c8d; }
        .holder-row { display: flex; justify-content: space-between; padding: 12px; background: #16213e; border-radius: 10px; margin-bottom: 8px; }
        .holder-rank { font-weight: bold; width: 40px; }
        .holder-address { flex: 1; font-family: monospace; font-size: 13px; }
        .holder-count { font-weight: bold; color: #e94560; }
        .loading, .no-results { text-align: center; padding: 40px; opacity: 0.6; }
        .debug { font-size: 12px; opacity: 0.5; text-align: center; margin-top: 20px; padding: 10px; background: #0f0f1a; border-radius: 8px; }
        .raffle-result { background: #0f3460; border-radius: 16px; padding: 20px; margin: 20px 0; text-align: center; }
        .raffle-winner { font-size: 24px; font-weight: bold; color: #e94560; margin: 10px 0; }
    </style>
</head>
<body>
<div class="container">
    <h2>🎨 Yupland Stamps Explorer</h2>
    <button id="raffleBtn" class="btn btn-primary">🎲 Провести розыгрыш</button>
    <div id="raffleResult" class="raffle-result" style="display: none;">
        <div>🏆 Победитель розыгрыша 🏆</div>
        <div id="raffleWinner" class="raffle-winner"></div>
    </div>
    <div class="tabs">
        <div class="tab active" data-tab="gallery">🖼️ Галерея</div>
        <div class="tab" data-tab="holders">🏆 Топ держатели</div>
    </div>
    <div id="galleryView"><div id="gallery"></div><button id="loadMoreBtn" class="btn" style="display: none;">Загрузить ещё</button></div>
    <div id="holdersView" style="display: none;"><div id="holdersList"></div></div>
    <div class="debug" id="debugInfo">🟢 Загрузка...</div>
</div>

<script>
    // ==================== НАСТРОЙКИ ====================
    const SUPABASE_URL = 'https://obbujhdmegdgxzdtpbai.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_R0pbZnbuSEbkaCLHcZ_YhQ_J2ZRgIB8';
    
    // ЕДИНСТВЕННЫЙ КЛИЕНТ (без дублирования)
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    let allStamps = [];
    let displayedCount = 20;
    
    async function loadStamps() {
        document.getElementById('debugInfo').innerHTML = '🔄 Загрузка марок...';
        const { data, error } = await supabaseClient.from('stamps').select('*').order('title');
        if (error) { 
            document.getElementById('debugInfo').innerHTML = '❌ Ошибка: ' + error.message; 
            return; 
        }
        allStamps = data;
        document.getElementById('debugInfo').innerHTML = `✅ Загружено ${allStamps.length} марок`;
        buildHoldersList();
        renderGallery();
    }
    
    function buildHoldersList() {
        const map = new Map();
        allStamps.forEach(s => { if (s.owner_id) map.set(s.owner_id, (map.get(s.owner_id) || 0) + 1); });
        const holders = Array.from(map.entries()).map(([a,c]) => ({ address: a, count: c })).sort((a,b) => b.count - a.count).slice(0,50);
        document.getElementById('holdersList').innerHTML = holders.map((h,i) => `<div class="holder-row"><span class="holder-rank">#${i+1}</span><span class="holder-address">${h.address}</span><span class="holder-count">${h.count} NFT</span></div>`).join('');
    }
    
    function getRarityClass(r) { const x = (r||'').toLowerCase(); if(x.includes('legend')) return 'rarity-legend'; if(x.includes('epic')) return 'rarity-epic'; if(x.includes('rare')) return 'rarity-rare'; return 'rarity-common'; }
    function getRarityLabel(r) { const x = (r||'').toLowerCase(); if(x.includes('legend')) return '⭐ Legend'; if(x.includes('epic')) return '💜 Epic'; if(x.includes('rare')) return '💙 Rare'; return '🤍 Common'; }
    
    function renderGallery() {
        const toShow = allStamps.slice(0, displayedCount);
        document.getElementById('gallery').innerHTML = toShow.map(s => `
            <div class="stamp-card">
                <img class="stamp-image" src="${s.image_url || 'https://placehold.co/80x80?text=🖼️'}" onerror="this.src='https://placehold.co/80x80?text=🖼️'">
                <div class="stamp-info">
                    <div class="stamp-title">${s.title || 'Без названия'}<span class="rarity-badge ${getRarityClass(s.rarity)}">${getRarityLabel(s.rarity)}</span></div>
                    <div class="stamp-group">📁 ${s.group_name || 'Без группы'}</div>
                    <div class="stamp-owner">👤 ${s.owner_id || 'Неизвестно'}</div>
                    ${s.reputation ? `<div style="font-size:11px;margin-top:4px;">⭐ Репутация: ${s.reputation}</div>` : ''}
                </div>
            </div>
        `).join('');
        document.getElementById('loadMoreBtn').style.display = displayedCount < allStamps.length ? 'block' : 'none';
    }
    
    function loadMore() { displayedCount += 20; renderGallery(); }
    
    function runRaffle() {
        const groups = [...new Set(allStamps.map(s => s.group_name).filter(g => g))];
        if(!groups.length) return;
        const randomGroup = groups[Math.floor(Math.random() * groups.length)];
        const groupStamps = allStamps.filter(s => s.group_name === randomGroup);
        if(!groupStamps.length) return;
        const winner = groupStamps[Math.floor(Math.random() * groupStamps.length)];
        document.getElementById('raffleWinner').innerHTML = `🎉 ${winner.title || winner.token_id} 🎉<br>📁 Группа: ${randomGroup}<br>👤 Владелец: ${winner.owner_id || 'неизвестно'}`;
        document.getElementById('raffleResult').style.display = 'block';
        setTimeout(() => document.getElementById('raffleResult').style.display = 'none', 10000);
    }
    
    document.getElementById('loadMoreBtn').addEventListener('click', loadMore);
    document.getElementById('raffleBtn').addEventListener('click', runRaffle);
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            const isGallery = tab.dataset.tab === 'gallery';
            document.getElementById('galleryView').style.display = isGallery ? 'block' : 'none';
            document.getElementById('holdersView').style.display = isGallery ? 'none' : 'block';
            if(!isGallery) buildHoldersList();
            else renderGallery();
        });
    });
    
    loadStamps();
</script>
</body>
</html>
