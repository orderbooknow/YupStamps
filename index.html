<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Yupland Stamps Explorer</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #1a1a2e;
            color: #eee;
            padding: 16px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        
        /* Кнопки */
        .btn {
            background: #0f3460;
            color: #eee;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 16px;
        }
        .btn-primary {
            background: #e94560;
        }
        
        /* Вкладки */
        .tabs {
            display: flex;
            gap: 4px;
            background: #16213e;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 20px;
        }
        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }
        .tab.active {
            background: #0f3460;
            color: #e94560;
        }
        
        /* Карточка марки */
        .stamp-card {
            background: #16213e;
            border-radius: 16px;
            margin-bottom: 16px;
            overflow: hidden;
            display: flex;
            gap: 12px;
            padding: 12px;
        }
        .stamp-image {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 12px;
            background: #0f3460;
            flex-shrink: 0;
        }
        .stamp-info {
            flex: 1;
        }
        .stamp-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .stamp-group {
            font-size: 12px;
            opacity: 0.7;
            margin-bottom: 4px;
        }
        .stamp-owner {
            font-size: 12px;
            padding: 4px 8px;
            background: #0f3460;
            border-radius: 6px;
            display: inline-block;
            margin-top: 6px;
        }
        .rarity-badge {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 12px;
            display: inline-block;
            margin-left: 8px;
        }
        .rarity-legend { background: #ffd700; color: #000; }
        .rarity-epic { background: #9b59b6; }
        .rarity-rare { background: #3498db; }
        .rarity-common { background: #7f8c8d; }
        
        /* Топ держатели */
        .holder-row {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            background: #16213e;
            border-radius: 10px;
            margin-bottom: 8px;
        }
        .holder-rank { font-weight: bold; width: 40px; }
        .holder-address { flex: 1; font-family: monospace; font-size: 13px; }
        .holder-count { font-weight: bold; color: #e94560; }
        
        .loading, .no-results { text-align: center; padding: 40px; opacity: 0.6; }
        .debug { font-size: 12px; opacity: 0.5; text-align: center; margin-top: 20px; padding: 10px; background: #0f0f1a; border-radius: 8px; }
        
        /* Результат розыгрыша */
        .raffle-result {
            background: #0f3460;
            border-radius: 16px;
            padding: 20px;
            margin: 20px 0;
            text-align: center;
        }
        .raffle-winner {
            font-size: 24px;
            font-weight: bold;
            color: #e94560;
            margin: 10px 0;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>🎨 Yupland Stamps Explorer</h2>
    <p style="font-size: 12px; opacity: 0.6; margin-bottom: 16px;">NEAR Blockchain • Postage Stamps</p>
    
    <button id="raffleBtn" class="btn btn-primary">🎲 Провести розыгрыш</button>
    
    <div id="raffleResult" class="raffle-result" style="display: none;">
        <div>🏆 Победитель розыгрыша 🏆</div>
        <div id="raffleWinner" class="raffle-winner"></div>
    </div>
    
    <div class="tabs">
        <div class="tab active" data-tab="gallery">🖼️ Галерея</div>
        <div class="tab" data-tab="holders">🏆 Топ держатели</div>
    </div>
    
    <div id="galleryView">
        <div id="gallery"></div>
        <button id="loadMoreBtn" class="btn" style="display: none;">Загрузить ещё</button>
    </div>
    
    <div id="holdersView" style="display: none;">
        <div id="holdersList"></div>
    </div>
    
    <div class="debug" id="debugInfo">🟢 Загрузка...</div>
</div>

<script>
    // ==================== НАСТРОЙКИ SUPABASE ====================
    const SUPABASE_URL = 'https://obbujhdmegdgxzdtpbai.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_R0pbZnbuSEbkaCLHcZ_YhQ_J2ZRgIB8';
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    // ==================== ПЕРЕМЕННЫЕ ====================
    let allStamps = [];
    let filteredStamps = [];
    let currentTab = 'gallery';
    let displayedCount = 20;
    
    // ==================== ЗАГРУЗКА ВСЕХ МАРОК ====================
    async function loadStamps() {
        document.getElementById('debugInfo').innerHTML = '🔄 Загрузка марок из Supabase...';
        
        const { data, error } = await supabase
            .from('stamps')
            .select('*')
            .order('title');
        
        if (error) {
            document.getElementById('debugInfo').innerHTML = '❌ Ошибка: ' + error.message;
            return;
        }
        
        allStamps = data;
        document.getElementById('debugInfo').innerHTML = `✅ Загружено ${allStamps.length} марок`;
        
        // Группируем для топа держателей
        buildHoldersList();
        
        // Показываем галерею
        renderGallery();
    }
    
    // ==================== ТОП ДЕРЖАТЕЛЕЙ ====================
    let topHolders = [];
    
    function buildHoldersList() {
        const holderMap = new Map();
        allStamps.forEach(stamp => {
            if (stamp.owner_id) {
                holderMap.set(stamp.owner_id, (holderMap.get(stamp.owner_id) || 0) + 1);
            }
        });
        topHolders = Array.from(holderMap.entries())
            .map(([address, count]) => ({ address, count }))
            .sort((a, b) => b.count - a.count)
            .slice(0, 50);
        
        renderHolders();
    }
    
    function renderHolders() {
        const container = document.getElementById('holdersList');
        if (topHolders.length === 0) {
            container.innerHTML = '<div class="loading">😕 Нет данных о держателях</div>';
            return;
        }
        container.innerHTML = topHolders.map((holder, idx) => `
            <div class="holder-row">
                <span class="holder-rank">#${idx + 1}</span>
                <span class="holder-address">${holder.address}</span>
                <span class="holder-count">${holder.count} NFT</span>
            </div>
        `).join('');
    }
    
    // ==================== ГАЛЕРЕЯ ====================
    function getRarityClass(rarity) {
        const r = (rarity || '').toLowerCase();
        if (r.includes('legend')) return 'rarity-legend';
        if (r.includes('epic')) return 'rarity-epic';
        if (r.includes('rare')) return 'rarity-rare';
        return 'rarity-common';
    }
    
    function getRarityLabel(rarity) {
        const r = (rarity || '').toLowerCase();
        if (r.includes('legend')) return '⭐ Legend';
        if (r.includes('epic')) return '💜 Epic';
        if (r.includes('rare')) return '💙 Rare';
        return '🤍 Common';
    }
    
    function renderGallery() {
        const container = document.getElementById('gallery');
        const loadMoreBtn = document.getElementById('loadMoreBtn');
        const toShow = allStamps.slice(0, displayedCount);
        
        if (toShow.length === 0) {
            container.innerHTML = '<div class="loading">🔄 Загрузка...</div>';
            loadMoreBtn.style.display = 'none';
            return;
        }
        
        container.innerHTML = toShow.map(stamp => `
            <div class="stamp-card">
                <img class="stamp-image" src="${stamp.image_url || 'https://placehold.co/80x80?text=🖼️'}" 
                     onerror="this.src='https://placehold.co/80x80?text=🖼️'">
                <div class="stamp-info">
                    <div class="stamp-title">
                        ${stamp.title || 'Без названия'}
                        <span class="rarity-badge ${getRarityClass(stamp.rarity)}">${getRarityLabel(stamp.rarity)}</span>
                    </div>
                    <div class="stamp-group">📁 ${stamp.group_name || 'Без группы'}</div>
                    <div class="stamp-owner">👤 ${stamp.owner_id || 'Неизвестно'}</div>
                    ${stamp.reputation ? `<div style="font-size: 11px; margin-top: 4px;">⭐ Репутация: ${stamp.reputation}</div>` : ''}
                </div>
            </div>
        `).join('');
        
        loadMoreBtn.style.display = displayedCount < allStamps.length ? 'block' : 'none';
    }
    
    function loadMore() {
        displayedCount += 20;
        renderGallery();
    }
    
    // ==================== РОЗЫГРЫШ ====================
    async function runRaffle() {
        // Получаем уникальные группы
        const groups = [...new Set(allStamps.map(s => s.group_name).filter(g => g))];
        if (groups.length === 0) {
            alert('Нет групп для розыгрыша');
            return;
        }
        
        // Выбираем случайную группу
        const randomGroup = groups[Math.floor(Math.random() * groups.length)];
        
        // Все марки в этой группе
        const groupStamps = allStamps.filter(s => s.group_name === randomGroup);
        if (groupStamps.length === 0) return;
        
        // Выбираем случайную марку
        const winner = groupStamps[Math.floor(Math.random() * groupStamps.length)];
        
        // Показываем результат
        document.getElementById('raffleWinner').innerHTML = `
            🎉 ${winner.title || winner.token_id} 🎉<br>
            📁 Группа: ${randomGroup}<br>
            👤 Владелец: ${winner.owner_id || 'неизвестно'}
        `;
        document.getElementById('raffleResult').style.display = 'block';
        
        // Прокручиваем к результату
        document.getElementById('raffleResult').scrollIntoView({ behavior: 'smooth' });
        
        // Через 10 секунд скрываем
        setTimeout(() => {
            document.getElementById('raffleResult').style.display = 'none';
        }, 10000);
    }
    
    // ==================== ОБРАБОТЧИКИ ====================
    document.getElementById('loadMoreBtn').addEventListener('click', loadMore);
    document.getElementById('raffleBtn').addEventListener('click', runRaffle);
    
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            currentTab = tab.dataset.tab;
            
            if (currentTab === 'gallery') {
                document.getElementById('galleryView').style.display = 'block';
                document.getElementById('holdersView').style.display = 'none';
                renderGallery();
            } else {
                document.getElementById('galleryView').style.display = 'none';
                document.getElementById('holdersView').style.display = 'block';
                renderHolders();
            }
        });
    });
    
    // ==================== ЗАПУСК ====================
    loadStamps();
</script>
</body>
</html>
